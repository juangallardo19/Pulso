<main class="page auth">
  <aside class="auth-side">
    <span class="sun"></span>
    <span class="hill one"></span>
    <span class="hill two"></span>
    <div class="faces">
      <img src="moods/1.svg" alt="" /><img src="moods/2.svg" alt="" /><img
        src="moods/3.svg"
        alt=""
      /><img src="moods/4.svg" alt="" /><img src="moods/5.svg" alt="" />
    </div>
    <h2>Empieza a escuchar tu ritmo</h2>
    <p>Registra tu ánimo, sueño, agua y ejercicio. Descubre tus patrones en semanas.</p>
  </aside>

  <section class="auth-main">
    <div class="back-row">
      <a routerLink="/onboarding" class="icon-btn" aria-label="Volver"
        ><span class="icon i-left"></span
      ></a>
    </div>

    <div>
      <h1>Crea tu cuenta</h1>
      <p class="muted">Empieza a registrar tu bienestar en minutos.</p>
    </div>

    <form class="form">
      <div class="form-group">
        <label for="name">Nombre</label>
        <div class="field">
          <span class="icon sm i-user"></span>
          <input id="name" type="text" placeholder="Laura Gómez" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <div class="field">
          <span class="icon sm i-mail"></span>
          <input id="email" type="email" placeholder="tu@universidad.edu.co" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="field">
          <span class="icon sm i-lock"></span>
          <input id="password" type="password" placeholder="Mínimo 8 caracteres" />
          <span class="icon sm i-eye"></span>
        </div>
        <div class="strength">
          <span class="on"></span><span class="on"></span><span></span>
          <small>Media</small>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirmar contraseña</label>
        <div class="field error">
          <span class="icon sm i-lock"></span>
          <input id="confirm" type="password" value="123456" />
        </div>
        <span class="error-text">Las contraseñas no coinciden</span>
      </div>

      <label class="consent">
        <input type="checkbox" checked />
        Acepto el aviso de privacidad. Mis datos de bienestar son solo míos.
      </label>

      <a routerLink="/metas" class="btn btn-primary">Crear cuenta</a>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
