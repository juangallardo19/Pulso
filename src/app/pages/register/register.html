<main class="page auth">
  <aside class="auth-side">
    <div class="auth-badges" aria-hidden="true">
      <span class="auth-badge"><span class="icon sm i-sparkle"></span> Descubre tus patrones</span>
      <span class="auth-badge"><span class="icon sm i-lock"></span> Tus datos son solo tuyos</span>
    </div>
    <span class="sun"></span>
    <span class="hill one"></span>
    <span class="hill two"></span>
    <div class="faces">
      <img src="moods/1.svg" alt="" /><img src="moods/2.svg" alt="" /><img
        src="moods/3.svg"
        alt=""
      /><img src="moods/4.svg" alt="" /><img src="moods/5.svg" alt="" />
    </div>
    <h2>Empieza a escuchar tu ritmo</h2>
    <p>Registra tu ánimo, sueño, agua y ejercicio. Descubre tus patrones en semanas.</p>
  </aside>

  <section class="auth-main">
    <div class="back-row">
      <a routerLink="/onboarding" class="icon-btn" aria-label="Volver"
        ><span class="icon i-left"></span
      ></a>
    </div>

    <div>
      <h1>Crea tu cuenta</h1>
      <p class="muted">Empieza a registrar tu bienestar en minutos.</p>
    </div>

    <form class="form" [formGroup]="registerForm">
      <div class="form-group">
        <label for="name">Nombre</label>
        <div class="field" [class.error]="campoInvalido('name')">
          <span class="icon sm i-user"></span>
          <input id="name" type="text" placeholder="Laura Gómez" formControlName="name" />
        </div>
        <app-field-error
          mensaje="Escribe tu nombre (mínimo 3 letras)"
          [visible]="campoInvalido('name')"
        ></app-field-error>
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <div class="field" [class.error]="campoInvalido('email') || correoYaRegistrado()">
          <span class="icon sm i-mail"></span>
          <input
            id="email"
            type="email"
            placeholder="tu@universidad.edu.co"
            formControlName="email"
          />
        </div>
        <app-field-error
          mensaje="Escribe un correo válido"
          [visible]="campoInvalido('email')"
        ></app-field-error>
        <app-field-error
          mensaje="Ya existe una cuenta con este correo. Inicia sesión."
          [visible]="correoYaRegistrado()"
        ></app-field-error>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="field" [class.error]="campoInvalido('password')">
          <span class="icon sm i-lock"></span>
          <input
            id="password"
            [attr.type]="verClave() ? 'text' : 'password'"
            placeholder="Mínimo 8 caracteres"
            formControlName="password"
          />
          <button
            type="button"
            class="ver-clave"
            [class.activo]="verClave()"
            [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="alternarClave()"
          >
            <span class="icon sm i-eye"></span>
          </button>
        </div>
        <div class="strength">
          <span *ngFor="let b of barras" [class.on]="b <= fuerza()"></span>
          <small>{{ textoFuerza() }}</small>
        </div>
        <app-field-error
          mensaje="Mínimo 8 caracteres"
          [visible]="campoInvalido('password')"
        ></app-field-error>
      </div>

      <div class="form-group">
        <label for="confirm">Confirmar contraseña</label>
        <div class="field" [class.error]="confirmacionInvalida()">
          <span class="icon sm i-lock"></span>
          <input
            id="confirm"
            [attr.type]="verClave() ? 'text' : 'password'"
            formControlName="confirm"
          />
        </div>
        <app-field-error
          mensaje="Las contraseñas no coinciden"
          [visible]="confirmacionInvalida()"
        ></app-field-error>
      </div>

      <label class="consent">
        <input type="checkbox" formControlName="consent" />
        Acepto el aviso de privacidad. Mis datos de bienestar son solo míos.
      </label>
      <app-field-error
        mensaje="Debes aceptar para continuar"
        [visible]="campoInvalido('consent')"
      ></app-field-error>

      <a
        routerLink="/metas"
        class="btn btn-primary"
        [class.deshabilitado]="!puedeCrear()"
        (click)="crearCuenta()"
        >Crear cuenta</a
      >
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </section>
</main>
