<main class="page auth">
  <aside class="auth-side">
    <span class="sun"></span>
    <span class="hill one"></span>
    <span class="hill two"></span>
    <div class="faces">
      <img src="moods/1.svg" alt="" /><img src="moods/2.svg" alt="" /><img
        src="moods/3.svg"
        alt=""
      /><img src="moods/4.svg" alt="" /><img src="moods/5.svg" alt="" />
    </div>
    <h2>Tu bienestar, un día a la vez</h2>
    <p>Un minuto al día para escucharte. Tus registros te esperan.</p>
  </aside>

  <section class="auth-main">
    <span class="brand"
      ><span class="logo"><span class="logo-mark"></span></span> Pulso</span
    >

    <div>
      <h1>Qué bueno verte de nuevo</h1>
      <p class="muted">Inicia sesión para seguir escuchando tu ritmo.</p>
    </div>

    <form class="form">
      <div class="form-group">
        <label for="email">Correo</label>
        <div class="field">
          <span class="icon sm i-mail"></span>
          <input id="email" type="email" placeholder="tu@universidad.edu.co" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="field">
          <span class="icon sm i-lock"></span>
          <input id="password" type="password" placeholder="••••••••" />
          <span class="icon sm i-eye"></span>
        </div>
      </div>

      <a class="link forgot">¿Olvidaste tu contraseña?</a>

      <a routerLink="/inicio" class="btn btn-primary">Iniciar sesión</a>
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </section>
</main>
