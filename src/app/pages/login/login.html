<main class="page auth">
  <aside class="auth-side">
    <span class="sun"></span>
    <span class="hill one"></span>
    <span class="hill two"></span>
    <div class="faces">
      <img src="moods/1.svg" alt="" /><img src="moods/2.svg" alt="" /><img
        src="moods/3.svg"
        alt=""
      /><img src="moods/4.svg" alt="" /><img src="moods/5.svg" alt="" />
    </div>
    <h2>Tu bienestar, un día a la vez</h2>
    <p>Un minuto al día para escucharte. Tus registros te esperan.</p>
  </aside>

  <section class="auth-main">
    <span class="brand"
      ><span class="logo"><span class="logo-mark"></span></span> Pulso</span
    >

    <div>
      <h1>Qué bueno verte de nuevo</h1>
      <p class="muted">Inicia sesión para seguir escuchando tu ritmo.</p>
    </div>

    <form class="form" [formGroup]="loginForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <div class="field" [class.error]="campoInvalido('email') || correoNoRegistrado()">
          <span class="icon sm i-mail"></span>
          <input
            id="email"
            type="email"
            placeholder="tu@universidad.edu.co"
            formControlName="email"
          />
        </div>
        <app-field-error
          mensaje="Escribe un correo válido"
          [visible]="campoInvalido('email')"
        ></app-field-error>
        <app-field-error
          mensaje="Este correo no está registrado"
          [visible]="correoNoRegistrado()"
        ></app-field-error>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="field" [class.error]="campoInvalido('password')">
          <span class="icon sm i-lock"></span>
          <input
            id="password"
            [attr.type]="verClave() ? 'text' : 'password'"
            placeholder="••••••••"
            formControlName="password"
          />
          <button
            type="button"
            class="ver-clave"
            [class.activo]="verClave()"
            [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="alternarClave()"
          >
            <span class="icon sm i-eye"></span>
          </button>
        </div>
        <app-field-error
          mensaje="Mínimo 8 caracteres"
          [visible]="campoInvalido('password')"
        ></app-field-error>
      </div>

      <a class="link forgot" (click)="olvideClave()">¿Olvidaste tu contraseña?</a>

      <a
        routerLink="/inicio"
        class="btn btn-primary"
        [class.deshabilitado]="loginForm.invalid || correoNoRegistrado()"
        (click)="entrar()"
        >Iniciar sesión</a
      >
    </form>

    <p class="auth-footer">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </section>
</main>
