<main class="page with-nav">
  <app-nav-bar></app-nav-bar>

  <div class="page-inner">
    <header class="page-header">
      <h1>Bienestar U</h1>
      <a routerLink="/bienestar" class="icon-btn" aria-label="Acción"
        ><span class="icon i-search"></span
      ></a>
    </header>

    <div class="chips filters">
      <app-chip-option
        *ngFor="let c of categorias"
        [label]="c"
        [active]="c === filtro()"
        (alternar)="filtro.set($event)"
      >
      </app-chip-option>
    </div>

    <section class="wellness-grid">
      <article class="card tint bg-coral hotline">
        <div class="row">
          <span class="bubble"><span class="icon i-heart c-accent"></span></span>
          <div class="grow">
            <h3>¿Necesitas hablar con alguien?</h3>
            <p class="small">Atención gratuita, en cualquier momento.</p>
          </div>
        </div>
        <div class="lines">
          <a href="tel:106" class="line pressable"
            ><span class="icon sm i-phone c-accent"></span> Línea 106</a
          >
          <a href="tel:192" class="line pressable"
            ><span class="icon sm i-phone c-accent"></span> 192 · opción 4</a
          >
        </div>
      </article>
      <app-service-card
        *ngFor="let s of serviciosFiltrados()"
        [service]="s"
        (contactar)="contactar($event)"
      >
      </app-service-card>
    </section>
  </div>
</main>
