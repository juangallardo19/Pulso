<main class="page with-nav">
  <app-nav-bar></app-nav-bar>

  <div class="page-inner">
    <header class="page-header centered">
      <a routerLink="/perfil" class="icon-btn" aria-label="Volver"
        ><span class="icon i-left"></span
      ></a>
      <h3>Recordatorios</h3>
      <span class="spacer"></span>
    </header>

    <p class="card vacio" [class.oculto]="recordatorios().length > 0">
      Aún no tienes recordatorios. Toca "Nuevo recordatorio" para crear el primero.
    </p>

    <section class="reminders">
      <app-reminder-card
        *ngFor="let r of recordatorios()"
        [reminder]="r"
        (alternar)="alternar($event)"
        (eliminar)="eliminar($event)"
      >
      </app-reminder-card>
    </section>

    <form class="card nuevo" [formGroup]="nuevoForm" [class.oculto]="!formularioVisible()">
      <h3>Nuevo recordatorio</h3>

      <label class="etiqueta" for="titulo">¿Qué quieres recordar?</label>
      <div class="field">
        <span class="icon sm i-bell"></span>
        <input
          id="titulo"
          type="text"
          formControlName="title"
          placeholder="Ej. Estirar la espalda"
        />
      </div>

      <label class="etiqueta" for="hora">¿A qué hora?</label>
      <div class="field campo-hora" (click)="abrirSelectorDeHora(hora)">
        <span class="icon sm i-clock"></span>
        <input #hora id="hora" type="time" formControlName="time" />
      </div>

      <span class="etiqueta">¿Qué días?</span>
      <div class="dias">
        <button
          *ngFor="let d of semana"
          type="button"
          class="dia"
          [class.on]="diasElegidos().includes(d)"
          [attr.aria-label]="nombresDias[d]"
          [attr.aria-pressed]="diasElegidos().includes(d)"
          (click)="alternarDia(d)"
        >
          {{ d }}
        </button>
      </div>
      <div class="atajos">
        <button type="button" class="atajo" (click)="elegirDias(semana)">Todos los días</button>
        <button type="button" class="atajo" (click)="elegirDias(['L', 'M', 'X', 'J', 'V'])">
          De lunes a viernes
        </button>
      </div>

      <p class="small aviso" [class.oculto]="estadoAvisos() === 'no'">
        Te avisaremos con una notificación del navegador mientras Pulso esté abierto.
      </p>
      <p class="small aviso" [class.oculto]="estadoAvisos() !== 'no'">
        Los avisos del navegador están bloqueados; actívalos en la configuración del sitio.
      </p>

      <button
        class="btn btn-primary guardar"
        type="button"
        (click)="agregar()"
        [class.deshabilitado]="!puedeGuardar()"
      >
        Guardar recordatorio
      </button>
    </form>

    <button
      class="btn btn-secondary new"
      type="button"
      (click)="formularioVisible.update((v) => !v)"
    >
      Nuevo recordatorio <span class="icon sm i-plus"></span>
    </button>
  </div>
</main>
