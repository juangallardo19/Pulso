<main class="page with-nav">
  <app-nav-bar></app-nav-bar>

  <div class="page-inner">
    <header class="page-header centered">
      <a routerLink="/perfil" class="icon-btn" aria-label="Volver"
        ><span class="icon i-left"></span
      ></a>
      <h3>Recordatorios</h3>
      <span class="spacer"></span>
    </header>

    <p class="card vacio" [class.oculto]="recordatorios().length > 0">
      Aún no tienes recordatorios. Toca "Nuevo recordatorio" para crear el primero.
    </p>

    <section class="reminders">
      <app-reminder-card
        *ngFor="let r of recordatorios()"
        [reminder]="r"
        (alternar)="alternar($event)"
        (eliminar)="eliminar($event)"
      >
      </app-reminder-card>
    </section>

    <form class="card" [formGroup]="nuevoForm" [class.oculto]="!formularioVisible()">
      <div class="field">
        <input type="text" formControlName="title" placeholder="Ej. Estirar la espalda" />
      </div>
      <div class="field"><input type="time" formControlName="time" /></div>
      <button
        class="btn btn-primary"
        type="button"
        (click)="agregar()"
        [class.deshabilitado]="nuevoForm.invalid"
      >
        Guardar
      </button>
    </form>

    <button
      class="btn btn-secondary new"
      type="button"
      (click)="formularioVisible.update((v) => !v)"
    >
      Nuevo recordatorio <span class="icon sm i-plus"></span>
    </button>
  </div>
</main>
