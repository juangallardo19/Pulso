<main class="page">
  <section class="ci">
    <header class="ci-top">
      <a routerLink="/checkin/estres" class="icon-btn" aria-label="Volver"
        ><span class="icon i-left"></span
      ></a>
      <div class="stepper" aria-label="Paso 6 de 6">
        <span class="done"></span><span class="done"></span><span class="done"></span
        ><span class="done"></span><span class="done"></span><span class="done"></span>
      </div>
      <a routerLink="/inicio" class="icon-btn" aria-label="Cerrar"
        ><span class="icon i-x"></span
      ></a>
    </header>

    <div class="ci-head">
      <span class="eyebrow">Paso 6 de 6</span>
      <h1>Así va tu día</h1>
      <p class="muted">Revisa y guarda tu check-in.</p>
    </div>

    <div class="ci-body">
      <article class="card summary">
        <div class="item">
          <img src="moods/4.svg" alt="" class="face-sm" /><span class="grow muted">Ánimo</span
          ><strong>Bien</strong>
        </div>
        <div class="item">
          <span class="bubble sm bg-blue"><span class="icon sm i-moon c-sleep"></span></span
          ><span class="grow muted">Sueño</span><strong>7 h 30 · calidad 4</strong>
        </div>
        <div class="item">
          <span class="bubble sm bg-mint"><span class="icon sm i-droplet c-secondary"></span></span
          ><span class="grow muted">Agua</span><strong>6 vasos</strong>
        </div>
        <div class="item">
          <span class="bubble sm bg-coral"><span class="icon sm i-flame c-accent"></span></span
          ><span class="grow muted">Ejercicio</span><strong>30 min · caminar</strong>
        </div>
        <div class="item">
          <span class="bubble sm bg-lav"><span class="icon sm i-activity c-primary"></span></span
          ><span class="grow muted">Estrés</span><strong>7 / 10</strong>
        </div>
      </article>

      <article class="card tint bg-sand row">
        <span class="icon i-sparkle c-accent"></span>
        <p class="grow">Tomaste 25 % más agua que ayer. ¡Sigue así!</p>
      </article>
    </div>

    <footer class="ci-actions">
      <a routerLink="/checkin/listo" class="btn btn-primary"
        >Guardar check-in <span class="icon sm i-check"></span
      ></a>
    </footer>
  </section>
</main>
